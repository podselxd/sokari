# Compila Sokari.exe y corre las pruebas en un Windows real en cada push. El
# exe y las capturas de la interfaz quedan como artefactos de la corrida, así
# se puede probar una rama sin compilarla. También compila y prueba la versión
# de Linux en Ubuntu 24.04 (Fedora está en pausa: vuelve con su port).
name: Compilar y probar

on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Sin conversión de fines de línea
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Misma versión en config.h y sokari.rc
        run: sh tests/check_version.sh

      - name: Compilar Sokari.exe (una advertencia cuenta como error)
        run: |
          set -o pipefail
          make -j4 OUT=build/Sokari.exe 2>&1 | tee build.log || exit 1
          if grep -q "warning:" build.log; then echo "::error::El compilador dio advertencias"; exit 1; fi

      - name: Compilar las pruebas
        run: |
          set -o pipefail
          make -j4 tests 2>&1 | tee tests.log || exit 1
          if grep -q "warning:" tests.log; then echo "::error::El compilador dio advertencias"; exit 1; fi

      - name: Correr las pruebas
        run: |
          mkdir -p build/capturas
          fail=0
          for t in build/tests/*.exe; do
            n=$(basename "$t" .exe)
            case "$n" in
              test_groq) echo "Se omite test_groq: necesita una API key de Groq."; continue ;;
              test_sphere|test_settings_ui) args=build/capturas ;;
              *) args= ;;
            esac
            echo "::group::$n"
            if "$t" $args; then echo "::endgroup::"; else
              rc=$?; echo "::endgroup::"; echo "::error::$n falló (código $rc)"; fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: Sokari-exe
          path: build/Sokari.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-interfaz
          path: build/capturas
          if-no-files-found: ignore

  linux-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev libpulse-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev espeak-ng pulseaudio dbus-daemon

      - name: Servidor de sonido de prueba (bocinas y micrófono de mentira)
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          # Sin clave: las pruebas corren con otra carpeta personal y no ven la de PulseAudio.
          pulseaudio --start --exit-idle-time=-1 -n --load="module-native-protocol-unix auth-anonymous=1" \
            --load="module-null-sink sink_name=bocinas sink_properties=device.description=Bocinas" \
            --load="module-null-sink sink_name=mic sink_properties=device.description=Microfono"
          pactl set-default-sink bocinas
          pactl set-default-source mic.monitor
          pactl info | grep -E "Server String|Default"

      - name: Compilar Sokari y las pruebas (una advertencia cuenta como error)
        run: |
          set -o pipefail
          make -f Makefile.linux -j4 all tests 2>&1 | tee build.log
          if grep -q "warning:" build.log; then echo "::error::El compilador dio advertencias"; exit 1; fi

      - name: Correr las pruebas
        run: sh tests/correr_linux.sh

      - name: Paquete .deb (Ubuntu 24.04 o más nuevo)
        run: sh linux/empaquetar.sh deb

      - name: Instalarlo y revisarlo
        run: |
          sudo apt-get install -y --no-install-recommends ./Sokari.deb
          sokari --version
          test "$(stat -c %U /usr/bin/sokari)" = root
          test -f /usr/share/gnome-shell/extensions/sokari@podselxd.github.io/extension.js
          test -f /usr/share/applications/io.github.podselxd.Sokari.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.podselxd.Sokari.png

      - uses: actions/upload-artifact@v4
        with:
          name: Sokari-deb
          path: Sokari.deb
          if-no-files-found: error

  # La extensión de GNOME de verdad: GNOME Shell sin pantalla, con dos
  # ventanas de prueba, y las herramientas de Sokari contra él. GNOME 46 es el
  # de Ubuntu 24.04 (GNOME 50 se probaba en Fedora 44: en pausa con Fedora).
  gnome-46-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (y GNOME Shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcurl4-openssl-dev \
            libpulse-dev libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev gnome-shell gjs dbus-daemon dbus-x11 \
            libglib2.0-bin

      - name: Compilar Sokari, su paquete y la prueba
        run: |
          make -f Makefile.linux -j4 all prueba-gnome
          sh linux/empaquetar.sh deb
          sudo apt-get install -y --no-install-recommends ./Sokari.deb

      # Con el Sokari instalado: la extensión le tiene que hacer caso sin
      # ninguna excepción de prueba (es de root y nadie más lo puede cambiar).
      - name: Probar la extensión en GNOME 46
        run: SOKARI_BIN=/usr/bin/sokari sh tests/linux/gnome/probar_extension.sh
