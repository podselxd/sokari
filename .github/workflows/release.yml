# Crea el release de una versión: compila y prueba en Windows, Linux y la app
# de Android, revisa que la versión coincida con el código y crea el release
# con Sokari.exe, Sokari.apk, Sokari.deb y Sokari.rpm adjuntos. El
# actualizador solo ve releases publicados: en Windows baja Sokari.exe; en
# Linux, el paquete de su sistema. Sin los secretos de la llave de la app, el
# release sale sin Sokari.apk y lo dice en sus notas (nunca con un APK mal firmado).
#
# Dos formas de lanzarlo:
# - Subir un tag vX.Y.Z: queda como BORRADOR para que lo publiques a mano.
# - Actions -> Borrador de release -> Run workflow, sobre master: escribes la
#   versión y eliges si sale publicado de una vez. Crea el tag él mismo.
name: Borrador de release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (vX.Y.Z), la misma que tiene el código en master'
        required: true
        type: string
      publicar:
        description: 'Publicarlo de una vez (si no, queda como borrador)'
        required: false
        type: boolean
        default: false
      notas:
        description: 'Texto al principio de las notas del release (opcional)'
        required: false
        type: string
        default: ''

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      con_app: ${{ steps.v.outputs.con_app }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: La versión coincide con el código
        env:
          ENTRADA: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          LLAVE: ${{ secrets.ANDROID_LLAVE }}
          LLAVE_CLAVE: ${{ secrets.ANDROID_LLAVE_CLAVE }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$ENTRADA"
            if [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "::error::Córrelo sobre master (se lanzó sobre $GITHUB_REF)."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Ya existe $tag: sube la versión en el código antes de crear otro release."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          sh tests/check_version.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$LLAVE" ] && [ -n "$LLAVE_CLAVE" ]; then
            echo "con_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "con_app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan los secretos ANDROID_LLAVE y ANDROID_LLAVE_CLAVE: este release sale sin Sokari.apk."
          fi

  compilar:
    needs: version
    uses: ./.github/workflows/compilar.yml

  movil:
    needs: version
    if: needs.version.outputs.con_app == 'true'
    uses: ./.github/workflows/movil.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit

  borrador:
    needs: [version, compilar, movil]
    # La app puede saltarse (sin llave), pero nunca haber fallado.
    if: >-
      always() && needs.version.result == 'success' && needs.compilar.result == 'success' &&
      (needs.movil.result == 'success' || needs.movil.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sokari-exe
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.version.outputs.con_app == 'true'
        with:
          name: Sokari-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: Sokari-deb
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: Sokari-rpm
          path: dist

      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PUBLICAR: ${{ inputs.publicar }}
          NOTAS: ${{ inputs.notas }}
          CON_APP: ${{ needs.version.outputs.con_app }}
        run: |
          archivos=(dist/Sokari.exe dist/Sokari.deb dist/Sokari.rpm)
          LINUX='> **Linux (beta):** `Sokari.deb` (Ubuntu 24.04 o más nuevo) y `Sokari.rpm` (Fedora 44), con GNOME. Probado en la CI (GNOME 46 y 50 sin pantalla), todavía no en una PC real. Instálalo, cierra sesión y vuelve a entrar una vez (así GNOME carga la extensión de Sokari) y ábrelo desde tus apps.'
          NOTAS="${NOTAS:+$NOTAS$'\n\n'}$LINUX"
          if [ "$CON_APP" = true ]; then
            archivos+=(dist/Sokari.apk)
          else
            NOTAS="${NOTAS:+$NOTAS$'\n\n'}> La app del celular (Sokari.apk) no viene en esta versión: faltan los secretos de su llave de firma. Llega en la siguiente."
          fi
          # La huella de cada archivo al lado (Sokari.exe.sha256…): el actualizador
          # la usa cuando la API de GitHub no le deja consultar (ver src/github.h).
          huellas=()
          for f in "${archivos[@]}"; do
            sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
            huellas+=("$f.sha256")
            echo "$(cat "$f.sha256")  $f"
          done
          args=(--title "Sokari $TAG" --generate-notes)
          if [ -n "$NOTAS" ]; then args+=(--notes "$NOTAS"); fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          if [ "$PUBLICAR" != true ]; then args+=(--draft); fi
          gh release create "$TAG" "${archivos[@]}" "${huellas[@]}" "${args[@]}"
